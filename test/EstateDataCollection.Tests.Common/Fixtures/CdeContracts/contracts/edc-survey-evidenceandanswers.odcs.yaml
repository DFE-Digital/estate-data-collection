version: "1.0.0"
kind: DataContract
apiVersion: v3.2.0

id: edc-survey-answers-evidence
name: CCDSurveySubmission-AnswersEvidence
status: draft

domain: capital-delivery
tenant: DfE

servers:
  - server: databricks
    type: databricks
    environment: dev
    description: CCD Survey answers and evidence data stored in the Databricks Silver layer
    catalog: eed_catalogue_30_bronze
    schema: cde_edc_integration

description:
  purpose: >
    Captures school estate survey submissions including survey metadata,
    school details, survey answers, and supporting evidence files.
  usage: >
    Used for collection, validation, auditability, reporting,
    and downstream processing of survey responses.
  limitations: >
    Only supports the structures defined within the survey answers
    and evidence schema. Additional properties are not permitted.
  customProperties:
    - property: catalog
      value: eed_cdc2_geospatial
    - property: schema
      value: silver
    - property: storageFormat
      value: delta

schema:
  - name: submission
    logicalType: object
    description: Top-level CCDSurveySubmission payload container

    properties:

      - name: survey
        logicalType: object
        required: true

        quality:
          - id: CDC-DQ1-JSONLogic
            type: custom
            engine: jsonlogic
            description: Survey updated timestamp must be greater than or equal to survey creation timestamp.
            implementation:
              ">=":
                - var: survey.updated_at
                - var: survey.created_at

        properties:

          - name: id
            physicalType: string
            logicalType: string
            required: true
            logicalTypeOptions:
              pattern: "^SURV-[A-Za-z0-9-]+$"

          - name: survey_name
            physicalType: string
            logicalType: string
            required: true

          - name: participant_id
            physicalType: string
            logicalType: string
            required: true

          - name: surveyor_email
            physicalType: string
            logicalType: string
            required: false
            logicalTypeOptions:
              format: email

          - name: is_complete
            physicalType: boolean
            logicalType: boolean
            required: true

          - name: created_at
            physicalType: string
            logicalType: timestamp
            required: true

          - name: updated_at
            physicalType: string
            logicalType: timestamp
            required: true

      - name: school
        logicalType: object
        required: true

        properties:

          - name: urn
            physicalType: string
            logicalType: string
            required: true

          - name: name
            physicalType: string
            logicalType: string
            required: false

      - name: answers
        logicalType: array
        required: true

        items:
          logicalType: object
          required: true

          properties:

            - name: id
              physicalType: string
              logicalType: string
              required: true
              logicalTypeOptions:
                pattern: "^ANS-[0-9]+$"

            - name: question_id
              physicalType: string
              logicalType: string
              required: true

            - name: asset_id
              physicalType: string
              logicalType: string
              required: true

            - name: asset_type
              physicalType: string
              logicalType: string
              required: true              
              enum:
                - value: site
                - value: block
                - value: floor
                - value: space
                - value: element

            - name: value
              logicalType: string
              required: true
              description: Survey response value. Actual datatype is determined by value_type.

            - name: value_type
              physicalType: string
              logicalType: string
              required: false              
              enum:
                - value: text
                - value: number
                - value: boolean
                - value: lookup_list
                - value: date

            - name: created_at
              physicalType: string
              logicalType: timestamp
              required: false

            - name: updated_at
              physicalType: string
              logicalType: timestamp
              required: false

            - name: evidence
              logicalType: array
              required: false

              items:
                logicalType: object

                properties:

                  - name: id
                    physicalType: string
                    logicalType: string
                    required: true
                    logicalTypeOptions:
                      pattern: "^EVD-[0-9]+$"

      - name: evidence
        logicalType: array
        required: true

        items:
          logicalType: object
          required: true

          properties:

            - name: id
              physicalType: string
              logicalType: string
              required: true
              logicalTypeOptions:
                pattern: "^EVD-[0-9]+$"

            - name: file_name
              physicalType: string
              logicalType: string
              required: false

            - name: file_path
              physicalType: string
              logicalType: string
              required: false

            - name: mime_type
              physicalType: string
              logicalType: string
              required: false

team:
  name: CDC2 Geospatial Programme
  members:
    - username: data-owner
      role: owner

tags:
  - cdc2
  - geospatial
  - school-estate
  - survey
  - answers
  - evidence
  - audit