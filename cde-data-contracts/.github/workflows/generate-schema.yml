name: Generate JSON Schemas

on:
  push:
    branches:
      - main
    paths:
      - 'contracts/*.odcs.yaml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Data Contract CLI
        run: |
          python -m pip install --upgrade pip
          pip install datacontract-cli

      - name: Show CLI Version
        run: |
          datacontract --version

      - name: Validate Contracts
        run: |
          datacontract lint contracts/edc-school-site-jsonlogic.odcs.yaml
          datacontract lint contracts/edc-survey-evidenceandanswers.odcs.yaml
          datacontract lint contracts/edc-survey-elements.odcs.yaml

      - name: Generate JSON Schema
        run: |
          mkdir -p schemas

          datacontract export jsonschema \
            contracts/edc-school-site-jsonlogic.odcs.yaml \
            --schema-name submission \
            --output schemas/edc-school-site.schema.json

          datacontract export jsonschema \
            contracts/edc-survey-evidenceandanswers.odcs.yaml \
            --schema-name submission \
            --output schemas/edc-survey-evidenceandanswers.schema.json
        
          datacontract export jsonschema \
            contracts/edc-survey-elements.odcs.yaml \
            --schema-name submission \
            --output schemas/edc-survey-elements.schema.json    

      - name: Show Generated Schema
        run: |
          echo "Generated schemas:"
          ls -la schemas
          
      - name: Commit generated schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schemas/*.json

          if git diff --staged --quiet; then
            echo "No schema changes detected."
          else
            git commit -m "chore: update generated JSON schemas [skip ci]"
            git push
          fi